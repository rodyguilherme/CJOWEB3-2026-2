<div class="container">
  <div class="col-sm-12 col-lg-6 offset-lg-3">
    <h1 class="text-center">{{ editing ? 'Edição de' : 'Nova' }} Atividade</h1>
  </div>
  <hr>
  <div class="col-lg-6 offset-lg-3 col-sm-12">

    <form #f="ngForm" autocomplete="off" (ngSubmit)="save()">

      <div class="mb-2">
        <label>Tipo</label>
        <p-select styleClass="w-100" [options]="types" placeholder="Selecione" name="type"
          [(ngModel)]="activity.type" #type="ngModel" required></p-select>
      </div>

      <div class="mb-2">
        <label>Data de realização</label>
        <p-datepicker styleClass="w-100" inputStyleClass="w-100" dateFormat="dd/mm/yy"
          [(ngModel)]="activity.date" name="date" #date="ngModel" required>
        </p-datepicker>
        <app-message [control]="date" error="required" text="Informe uma data"></app-message>
      </div>

      <div class="mb-2">
        <label for="distance">Distância (em Km)</label>
        <input type="number" step="0.1" class="form-control" [(ngModel)]="activity.distance"
          name="distance" id="distance" #distance="ngModel" required>
        <app-message [control]="distance" error="required" text="Informe uma distância"></app-message>
      </div>

      <div class="mb-3">
        <label for="duration">Duração (em minutos)</label>
        <input type="number" step="1" class="form-control" [(ngModel)]="activity.duration"
          name="duration" id="duration" #duration="ngModel" required>
        <app-message [control]="duration" error="required" text="Informe uma duração"></app-message>
      </div>

      <div class="mb-2">
        <button type="submit" class="btn btn-primary" [disabled]="f.invalid">Salvar</button>
      </div>

      <div class="mb-2">
        <button type="button" class="btn btn-outline-success" (click)="new(f)">Nova</button>
      </div>

      <a routerLink="/activities" class="btn btn-secondary w-100">Voltar</a>

    </form>

  </div>
</div>
