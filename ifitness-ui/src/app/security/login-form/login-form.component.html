<div class="container">
  <div class="col-lg-4 offset-lg-4 col-sm-12">

    <form autocomplete="off" #f="ngForm">
      <h1 class="text-center">Login</h1>

      <div class="alert alert-danger" role="alert" *ngIf="msg">
        {{ msg }}
      </div>

      <div class="input-group mb-3">
        <span class="input-group-text">
          <i class="bi bi-envelope"></i>
        </span>
        <input type="email" name="user" placeholder="E-mail" class="form-control"
          ngModel required #user>
      </div>

      <div class="input-group mb-3">
        <span class="input-group-text">
          <i class="bi bi-file-lock"></i>
        </span>
        <input type="password" name="password" placeholder="Senha" class="form-control"
          ngModel required #password>
      </div>

      <div class="mb-3">
        <button type="submit" class="btn btn-primary" [disabled]="!f.valid"
          (click)="login(user.value, password.value)">Login</button>
      </div>

      <div class="mb-3">
        <a routerLink="/users/new" class="btn btn-secondary">Cadastrar</a>
      </div>

    </form>

  </div>
</div>
