<div class="container">
  <div class="col-lg-6 offset-lg-3 col-sm-12">

    <form #f="ngForm" autocomplete="off" (ngSubmit)="save()">
      <h1 class="text-center">Cadastre-se</h1>

      <div class="mb-2">
        <label for="name">Nome completo*</label>
        <input type="text" name="name" id="name" class="form-control"
          [(ngModel)]="user.name" #name="ngModel" required minlength="3" maxlength="50">
        <app-message [control]="name" error="required" text="Informe um nome"></app-message>
        <app-message [control]="name" error="minlength"
          text="Mínimo de {{ name.errors?.minlength?.requiredLength }} caracteres. Você digitou apenas {{ name.errors?.minlength?.actualLength }}"></app-message>
      </div>

      <div class="mb-2">
        <label for="email">E-mail*</label>
        <input type="email" name="email" id="email" class="form-control"
          [(ngModel)]="user.email" #email="ngModel" required>
        <app-message [control]="email" error="required" text="Informe um e-mail"></app-message>
      </div>

      <div class="mb-2">
        <label for="password">Senha* (de 6 a 8 caracteres)</label>
        <input type="password" name="password" id="password" class="form-control"
          [(ngModel)]="user.password" #password="ngModel" required minlength="6" maxlength="8">
        <app-message [control]="password" error="required" text="Informe uma senha de 6 a 8 caracteres."></app-message>
        <app-message [control]="password" error="minlength"
          text="Mínimo de {{ password.errors?.minlength?.requiredLength }} caracteres. Você digitou apenas {{ password.errors?.minlength?.actualLength }}"></app-message>
      </div>

      <div class="mb-2">
        <label>Data de Nascimento*</label>
        <p-datepicker styleClass="w-100" inputStyleClass="w-100" dateFormat="dd/mm/yy"
          [(ngModel)]="user.date" name="date" #date="ngModel" required>
        </p-datepicker>
        <app-message [control]="date" error="required" text="Informe uma data"></app-message>
      </div>

      <div class="mb-3">
        <label>Gênero*</label>
        <p-select styleClass="w-100" name="gender" [options]="genders" placeholder="Selecione"
          [(ngModel)]="user.gender" #type="ngModel" required></p-select>
      </div>

      <div class="mb-2">
        <button type="submit" class="btn btn-primary" [disabled]="f.invalid">Salvar</button>
      </div>

      <div class="mb-2">
        <a routerLink="/login" class="btn btn-secondary w-100">Cancelar</a>
      </div>

    </form>

  </div>
</div>
